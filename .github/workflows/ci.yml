name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  test-backend:
    name: Backend tests (unit, integration, concurrency)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start a MongoDB replica set (transactions need one)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }" && break
            sleep 2
          done
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true && exit 0
            sleep 2
          done
          echo "replica set did not become primary" && exit 1
      - name: Run all backend tests
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
          TEST_REDIS_URL: redis://localhost:6379
        run: npm run test --workspace backend -- --ci

  build-frontend:
    name: Frontend production build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: /api

  docker:
    name: Build production images
    runs-on: ubuntu-24.04
    needs: [quality, test-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: memed-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api
          tags: memed-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
